[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "intrinsic-dimension-transformers"
version = "0.1.0"
description = "Reproducible spectral and geometric analysis of transformer representations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "tqdm>=4.66,<5"]
[project.optional-dependencies]
model = ["torch>=2.2,<3", "transformers==4.46.3", "tokenizers>=0.20,<0.21", "huggingface-hub>=0.26,<1", "safetensors>=0.4,<1"]
test = ["pytest>=8,<9"]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
[project.scripts]
intrinsic-dim = "intrinsic_dim.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
